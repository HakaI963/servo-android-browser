name: Kotlin compile check
on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34'
      - name: Compile browser Kotlin sources
        working-directory: support/android/apk
        run: |
          chmod +x gradlew
          ./gradlew :servoapp:compileArm64ReleaseKotlin --stacktrace
